<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI ADS - Premium AI Advertising Agency</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/scheduler@0.23.0/umd/scheduler.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone@7.28.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --color-bg: #0F0F0F;
            --color-bg-light: #1F1F1F;
            --color-accent: #B0B0B0;
            --color-accent-dark: #808080;
            --color-text: #FFFFFF;
            --color-text-secondary: #CCCCCC;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--color-bg);
            color: var(--color-text);
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        @media (max-width: 768px) {
            html {
                font-size: 14px;
            }
        }

        @media (max-width: 480px) {
            html {
                font-size: 13px;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes countUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        @keyframes glow {
            0%, 100% {
                box-shadow: 0 0 20px rgba(176, 176, 176, 0.3);
            }
            50% {
                box-shadow: 0 0 40px rgba(176, 176, 176, 0.6);
            }
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes shimmer {
            0% {
                background-position: -1000px 0;
            }
            100% {
                background-position: 1000px 0;
            }
        }

        .animate-fade-in {
            animation: fadeIn 0.8s ease-out;
        }

        .animate-count-up {
            animation: countUp 0.8s ease-out forwards;
            opacity: 0;
        }

        .animate-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        .animate-slide-in-up {
            animation: slideInUp 0.6s ease-out;
        }

        .animate-slide-in-down {
            animation: slideInDown 0.6s ease-out;
        }

        .animate-slide-in-left {
            animation: slideInLeft 0.6s ease-out;
        }

        .animate-slide-in-right {
            animation: slideInRight 0.6s ease-out;
        }

        .animate-scale-in {
            animation: scaleIn 0.6s ease-out;
        }

        .animate-float {
            animation: float 4s ease-in-out infinite;
        }

        .animate-glow {
            animation: glow 3s ease-in-out infinite;
        }

        .service-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, rgba(176, 176, 176, 0.2), rgba(160, 160, 160, 0.1));
            border: 1px solid rgba(176, 176, 176, 0.3);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .service-icon svg {
            width: 32px;
            height: 32px;
            stroke: #B0B0B0;
            stroke-width: 1.5;
            fill: none;
        }

        .service-card:hover .service-icon {
            background: linear-gradient(135deg, rgba(176, 176, 176, 0.4), rgba(160, 160, 160, 0.2));
            border-color: rgba(176, 176, 176, 0.6);
            transform: translateY(-8px) rotate(5deg);
        }

        .bg-gradient-text {
            background: linear-gradient(to right, #FFFFFF, #B0B0B0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .gradient-purple-cyan {
            background: linear-gradient(135deg, #B0B0B0, #A0A0A0);
        }

        /* Mobile Optimization */
        @media (max-width: 768px) {
            .brand-wordmark {
                white-space: nowrap;
            }

            button.mobile-menu-toggle {
                width: 44px !important;
                min-width: 44px !important;
                min-height: 44px;
                padding: 8px !important;
                flex: 0 0 44px;
            }

            button.whatsapp-floating {
                width: 56px !important;
                height: 56px !important;
                min-width: 56px;
                min-height: 56px;
                padding: 0 !important;
                right: 16px !important;
                bottom: 16px !important;
                border-radius: 50% !important;
            }

            nav {
                padding: 12px 16px;
            }

            section {
                padding: 40px 16px;
            }

            h1, h2 {
                font-size: clamp(28px, 8vw, 48px) !important;
            }

            h3 {
                font-size: clamp(18px, 5vw, 24px) !important;
            }

            p {
                font-size: clamp(14px, 3.5vw, 18px) !important;
            }

            button {
                padding: 12px 24px !important;
                font-size: 14px !important;
                min-height: 44px;
                min-width: 44px;
                touch-action: manipulation;
            }

            input, textarea {
                padding: 14px 16px !important;
                font-size: 16px !important;
            }

            .service-card {
                padding: 20px !important;
            }

            .service-icon {
                width: 48px !important;
                height: 48px !important;
            }
        }

        @media (max-width: 480px) {
            nav {
                padding: 12px 12px;
            }

            section {
                padding: 32px 12px;
            }

            h1 {
                font-size: 32px !important;
                line-height: 1.2 !important;
            }

            h2 {
                font-size: 28px !important;
            }

            button {
                width: 100% !important;
                padding: 14px 20px !important;
            }

            .service-card {
                padding: 16px !important;
                margin-bottom: 8px;
            }

            form {
                padding: 20px !important;
            }

            input, textarea {
                width: 100% !important;
                padding: 12px 14px !important;
                font-size: 16px !important;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const AIADSWebsite = () => {
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const [scrolled, setScrolled] = useState(false);
            const [selectedFilter, setSelectedFilter] = useState('all');
            const [formData, setFormData] = useState({ name: '', phone: '', email: '', project: '', website: '' });
            const [formStatus, setFormStatus] = useState('');
            const [viewportWidth, setViewportWidth] = useState(window.innerWidth);

            useEffect(() => {
                const handleScroll = () => {
                    setScrolled(window.scrollY > 50);
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            useEffect(() => {
                const handleResize = () => setViewportWidth(window.innerWidth);
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            const openWhatsApp = (message) => {
                const phone = '919487143267';
                const text = encodeURIComponent(message);
                window.open(`https://wa.me/${phone}?text=${text}`, '_blank');
            };

            const GOOGLE_SHEETS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxcPA4WrbmrF7ImjhI7IImtTVqlobXZGCypLt8imGQCx9KHlJuWGbUqONTrRrglpoqk/exec';

            const submitLeadToGoogleSheets = (lead) => {
                const payload = new URLSearchParams({
                    name: lead.name,
                    phone: lead.phone,
                    email: lead.email,
                    project: lead.project,
                    website: lead.website
                });
                return fetch(GOOGLE_SHEETS_WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: payload.toString()
                });
            };

            const handleFormSubmit = (e) => {
                e.preventDefault();
                const lead = {
                    name: formData.name.trim(),
                    phone: formData.phone.trim(),
                    email: formData.email.trim(),
                    project: formData.project.trim(),
                    website: formData.website.trim()
                };
                if (lead.website) return;
                if (!lead.name || !lead.phone || !lead.project) {
                    setFormStatus('Please fill all required fields');
                    setTimeout(() => setFormStatus(''), 3000);
                    return;
                }
                submitLeadToGoogleSheets(lead).catch(() => {
                    console.error('Unable to submit this enquiry to the AI ADS lead sheet.');
                });
                setFormStatus('success');
                setTimeout(() => {
                    setFormStatus('');
                    setFormData({ name: '', phone: '', email: '', project: '', website: '' });
                }, 3000);
            };

            const portfolio = [
                { id: 1, title: 'Fashion Brand Campaign', category: 'brand-campaigns', color: '#B0B0B0', description: 'Cinematic advertisement for luxury fashion brand' },
                { id: 2, title: 'Product Launch Video', category: 'video-ads', color: '#A0A0A0', description: 'High-impact product reveal advertisement', videoUrl: '/manus-storage/2_a6fc306d.mp4' },
                { id: 3, title: 'E-commerce Showcase', category: 'product-showcases', color: '#B0B0B0', description: 'Premium product showcase for online store' },
                { id: 4, title: 'Brand Story Film', category: 'brand-films', color: '#A0A0A0', description: 'Story-driven brand experience', videoUrl: '/manus-storage/4_b9f99baa.mp4' },
                { id: 5, title: 'Social Media Series', category: 'social-content', color: '#B0B0B0', description: 'Engaging reel and story content' },
                { id: 6, title: 'Tech Product Ad', category: 'video-ads', color: '#A0A0A0', description: 'Cinematic tech product advertisement' },
                { id: 7, title: 'Featured Video', category: 'video-ads', color: '#A0A0A0', description: 'Watch the featured video sample.', videoUrl: '/manus-storage/5_9f9a26a0.mp4', posterUrl: '/manus-storage/aiads-featured-video-poster_27e3f1fd.jpg' },
                { id: 8, title: 'Social Content Video', category: 'social-content', color: '#B0B0B0', description: 'Short-form video for social media', videoUrl: '/manus-storage/1_7cdd7505.mp4' },
            ];

            const filteredPortfolio = selectedFilter === 'all'
                ? portfolio
                : portfolio.filter(item => item.category === selectedFilter);

            return (
                <div style={{ backgroundColor: '#0A0A0A', color: 'white' }}>
                    {/* Navigation */}
                    <nav style={{
                        position: 'fixed',
                        width: '100%',
                        zIndex: 50,
                        transition: 'all 0.3s ease',
                        backgroundColor: scrolled ? 'rgba(10, 10, 10, 0.95)' : 'transparent',
                        backdropFilter: scrolled ? 'blur(12px)' : 'none',
                        padding: scrolled ? '12px 24px' : '24px'
                    }}>
                        <div style={{ maxWidth: '1280px', margin: '0 auto', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                            <a href="/" aria-label="AI ADS home" style={{ display: 'inline-flex', alignItems: 'center', textDecoration: 'none' }}>
                                <img src="/assets/aiads-platform-logo.svg" alt="" width={viewportWidth > 768 ? 84 : 64} height={viewportWidth > 768 ? 84 : 64} style={{ display: 'block', objectFit: 'contain' }} />
                            </a>

                            <div className="nav-desktop" style={{ display: viewportWidth > 768 ? 'flex' : 'none', gap: '48px', alignItems: 'center' }}>
                                <a href="#services" style={{ fontSize: '14px', cursor: 'pointer', transition: 'color 0.3s' }} onMouseEnter={(e) => e.target.style.color = '#c084fc'} onMouseLeave={(e) => e.target.style.color = 'white'}>Services</a>
                                <a href="#work" style={{ fontSize: '14px', cursor: 'pointer', transition: 'color 0.3s' }} onMouseEnter={(e) => e.target.style.color = '#c084fc'} onMouseLeave={(e) => e.target.style.color = 'white'}>Work</a>
                                <a href="#process" style={{ fontSize: '14px', cursor: 'pointer', transition: 'color 0.3s' }} onMouseEnter={(e) => e.target.style.color = '#c084fc'} onMouseLeave={(e) => e.target.style.color = 'white'}>Process</a>
                                <a href="#contact" style={{ fontSize: '14px', cursor: 'pointer', transition: 'color 0.3s' }} onMouseEnter={(e) => e.target.style.color = '#c084fc'} onMouseLeave={(e) => e.target.style.color = 'white'}>Contact</a>
                                <button
                                    onClick={() => openWhatsApp('Hi AI ADS, I want to start a project.')}
                                    style={{ padding: '8px 24px', backgroundColor: '#B0B0B0', color: '#0F0F0F', border: 'none', borderRadius: '8px', cursor: 'pointer', fontSize: '14px', fontWeight: '500', transition: 'background-color 0.3s' }}
                                    onMouseEnter={(e) => e.target.style.backgroundColor = '#CCCCCC'}
                                    onMouseLeave={(e) => e.target.style.backgroundColor = '#B0B0B0'}
                                >
                                    Start a Project
                                </button>
                            </div>

                            <button
                                className="mobile-menu-toggle"
                                style={{ display: viewportWidth > 768 ? 'none' : 'block', background: 'none', border: 'none', color: 'white', cursor: 'pointer', fontSize: '24px' }}
                                onClick={() => setIsMenuOpen(!isMenuOpen)}
                            >
                                {isMenuOpen ? '✕' : '☰'}
                            </button>
                        </div>

                        {/* Mobile Menu */}
                        {isMenuOpen && (
                            <div style={{ backgroundColor: 'rgba(10, 10, 10, 0.95)', backdropFilter: 'blur(12px)', marginTop: '16px', padding: '24px' }}>
                                <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
                                    <a href="#services" style={{ fontSize: '14px', cursor: 'pointer' }}>Services</a>
                                    <a href="#work" style={{ fontSize: '14px', cursor: 'pointer' }}>Work</a>
                                    <a href="#process" style={{ fontSize: '14px', cursor: 'pointer' }}>Process</a>
                                    <a href="#contact" style={{ fontSize: '14px', cursor: 'pointer' }}>Contact</a>
                                    <button
                                        onClick={() => { openWhatsApp('Hi AI ADS, I want to start a project.'); setIsMenuOpen(false); }}
                                        style={{ width: '100%', padding: '8px 24px', backgroundColor: '#B0B0B0', color: 'white', border: 'none', borderRadius: '8px', cursor: 'pointer', fontSize: '14px', fontWeight: '500', marginTop: '8px' }}
                                    >
                                        Start a Project
                                    </button>
                                </div>
                            </div>
                        )}
                    </nav>

                    {/* Hero Section */}
                    <section style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', paddingTop: '80px', position: 'relative', overflow: 'hidden', padding: '24px' }}>
                        <div style={{ position: 'absolute', inset: 0, background: 'linear-gradient(to bottom, rgba(176, 176, 176, 0.2), transparent)', opacity: 0, transition: 'opacity 0.5s' }} onMouseEnter={(e) => e.currentTarget.style.opacity = '1'} onMouseLeave={(e) => e.currentTarget.style.opacity = '0'}></div>

                        <div style={{ maxWidth: '1280px', margin: '0 auto', width: '100%', display: 'grid', gridTemplateColumns: viewportWidth > 768 ? '1fr 1fr' : '1fr', gap: '48px', alignItems: 'center', position: 'relative', zIndex: 10 }}>
                            <div style={{ space: '32px', display: 'flex', flexDirection: 'column', gap: '32px', animation: 'slideInLeft 0.8s ease-out' }}>
                                <h1 style={{ fontSize: viewportWidth > 768 ? '56px' : '48px', fontWeight: 'bold', lineHeight: '1.1', letterSpacing: '-1px', animation: 'slideInUp 0.8s ease-out 0.1s both' }}>
                                    Your Brand.
                                    <br />
                                    <span style={{ background: 'linear-gradient(to right, #D0D0D0, #A0A0A0, #808080)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent', backgroundClip: 'text' }}>
                                        Reimagined
                                    </span>
                                    <br />
                                    with AI.
                                </h1>

                                <p style={{ fontSize: '20px', color: '#d1d5db', maxWidth: '672px', lineHeight: '1.6', animation: 'slideInUp 0.8s ease-out 0.2s both' }}>
                                    Scroll-stopping AI video advertisements crafted to make your brand impossible to ignore.
                                </p>

                                <p style={{ fontSize: '18px', color: '#9ca3af', maxWidth: '672px', lineHeight: '1.5', animation: 'slideInUp 0.8s ease-out 0.3s both' }}>
                                    From product videos to complete brand campaigns, we turn ideas into cinematic content designed for today's digital audience.
                                </p>

                                <div style={{ display: 'flex', flexDirection: viewportWidth > 768 ? 'row' : 'column', gap: '16px', paddingTop: '24px', animation: 'slideInUp 0.8s ease-out 0.4s both' }}>
                                    <button
                                        onClick={() => openWhatsApp('Hi AI ADS, I want to start a project.')}
                                        style={{ padding: '16px 32px', backgroundColor: '#B0B0B0', color: '#0F0F0F', border: 'none', borderRadius: '8px', fontWeight: '600', cursor: 'pointer', transition: 'all 0.3s', transform: 'scale(1)' }}
                                        onMouseEnter={(e) => { e.target.style.backgroundColor = '#CCCCCC'; e.target.style.transform = 'scale(1.05)'; }}
                                        onMouseLeave={(e) => { e.target.style.backgroundColor = '#B0B0B0'; e.target.style.transform = 'scale(1)'; }}
                                    >
                                        Start a Project
                                    </button>
                                    <button
                                        onClick={() => document.getElementById('work').scrollIntoView({ behavior: 'smooth' })}
                                        style={{ padding: '16px 32px', border: '2px solid #B0B0B0', color: 'white', backgroundColor: 'transparent', borderRadius: '8px', fontWeight: '600', cursor: 'pointer', transition: 'all 0.3s' }}
                                        onMouseEnter={(e) => e.target.style.backgroundColor = 'rgba(176, 176, 176, 0.1)'}
                                        onMouseLeave={(e) => e.target.style.backgroundColor = 'transparent'}
                                    >
                                        View Our Work
                                    </button>
                                </div>
                            </div>

                            {/* Hero Visual */}
                            {viewportWidth > 768 && (
                                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', animation: 'slideInRight 0.8s ease-out 0.2s both' }}>
                                    <div style={{ position: 'relative', width: '320px', height: '320px' }}>
                                        <div style={{ position: 'absolute', inset: 0, background: 'linear-gradient(135deg, rgba(176, 176, 176, 0.3), rgba(160, 160, 160, 0.2))', borderRadius: '24px', filter: 'blur(48px)', animation: 'glow 3s ease-in-out infinite' }}></div>
                                        <div style={{ position: 'absolute', inset: 0, border: '1px solid rgba(176, 176, 176, 0.2)', borderRadius: '24px', backdropFilter: 'blur(10px)', display: 'flex', alignItems: 'center', justifyContent: 'center', animation: 'float 4s ease-in-out infinite' }}>
                                            <svg width="140" height="140" viewBox="0 0 140 140" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                <rect x="20" y="50" width="100" height="70" rx="8" stroke="#B0B0B0" strokeWidth="2" fill="none"/>
                                                <circle cx="70" cy="85" r="20" stroke="#B0B0B0" strokeWidth="2" fill="none"/>
                                                <circle cx="70" cy="85" r="10" fill="#B0B0B0"/>
                                                <path d="M 40 50 L 30 20 M 100 50 L 110 20" stroke="#B0B0B0" strokeWidth="2"/>
                                            </svg>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </section>

                    {/* Stats Section */}
                    <section style={{ padding: '80px 24px', background: 'linear-gradient(to bottom, transparent, rgba(176, 176, 176, 0.1))' }}>
                        <div style={{ maxWidth: '1280px', margin: '0 auto', display: 'grid', gridTemplateColumns: viewportWidth > 768 ? '1fr 1fr 1fr' : '1fr', gap: '48px', textAlign: 'center' }}>
                            {[
                                { num: '50+', label: 'Brands Served' },
                                { num: '200+', label: 'Ads Created' },
                                { num: '10M+', label: 'Views Generated' }
                            ].map((stat, i) => (
                                <div key={i} style={{ display: 'flex', flexDirection: 'column', gap: '8px', animation: 'countUp 0.8s ease-out forwards', opacity: 0, animationDelay: `${i * 0.1}s` }}>
                                    <div style={{ fontSize: viewportWidth > 768 ? '64px' : '48px', fontWeight: 'bold', color: i % 2 === 0 ? '#B0B0B0' : '#A0A0A0' }}>{stat.num}</div>
                                    <p style={{ color: '#9ca3af' }}>{stat.label}</p>
                                </div>
                            ))}
                        </div>
                    </section>

                    {/* Services Section */}
                    <section id="services" style={{ padding: '80px 24px', maxWidth: '1280px', margin: '0 auto' }}>
                        <div style={{ display: 'flex', flexDirection: 'column', gap: '16px', marginBottom: '64px' }}>
                            <p style={{ fontSize: '12px', fontWeight: '600', color: '#B0B0B0', letterSpacing: '1px', animation: 'slideInUp 0.6s ease-out' }}>WHAT WE DO</p>
                            <h2 style={{ fontSize: viewportWidth > 768 ? '56px' : '44px', fontWeight: 'bold', animation: 'slideInUp 0.6s ease-out 0.1s both' }}>AI-Powered Advertising. Built for Attention.</h2>
                            <p style={{ fontSize: '18px', color: '#9ca3af', maxWidth: '672px', animation: 'slideInUp 0.6s ease-out 0.2s both' }}>
                                We create high-impact visual content that helps businesses showcase their products, build their brand, and connect with their audience.
                            </p>
                        </div>

                        <div style={{ display: 'grid', gridTemplateColumns: viewportWidth > 1024 ? '1fr 1fr 1fr' : viewportWidth > 768 ? '1fr 1fr' : '1fr', gap: '32px' }}>
                            {[
                                {
                                    title: 'AI Video Ads',
                                    desc: 'Cinematic AI-powered advertisements created for today\'s biggest digital platforms.',
                                    highlight: 'Turn your product into a story people want to watch.',
